<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LocalSend · 局域网文件传输</title>
<link rel="icon" type="image/png" href="/localsend/favicon.png" />
<link rel="manifest" href="/localsend/manifest.webmanifest" />
<meta name="theme-color" content="#10b981" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="LocalSend" />
<!-- 本地资源：局域网常常没有外网，CDN 不可达时会导致页面无样式、二维码无法生成 -->
<link rel="stylesheet" href="/localsend/style.css" />
<script src="/localsend/vendor/qr-code-styling.js"></script>
<style>
  #fileInput, #dirInput { display: none; }
  #toast { transition: opacity .25s; }
  #toast.hidden { opacity: 0; pointer-events: none; }
  #pageQr canvas { width: 100% !important; height: auto !important; display: block; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  /* 上传后新文件的高亮定位 */
  @keyframes fileNewFlash {
    0% { background-color: rgba(16, 185, 129, .28); box-shadow: inset 3px 0 0 #10b981; }
    70% { background-color: rgba(16, 185, 129, .28); box-shadow: inset 3px 0 0 #10b981; }
    100% { background-color: transparent; box-shadow: inset 3px 0 0 transparent; }
  }
  .file-new-flash { animation: fileNewFlash 3s ease-out; }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200">
<div class="max-w-5xl mx-auto px-3 sm:px-4 py-6 sm:py-8">

  <header class="flex items-center justify-between gap-3 sm:gap-4 mb-6 sm:mb-8 flex-wrap">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 sm:w-3 sm:h-3 bg-emerald-400 rounded-full animate-pulse"></span>
        LocalSend
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1">局域网文件传输 · 同网段设备扫码即可访问</p>
    </div>
    <div class="text-left sm:text-right">
      <div class="text-xs text-slate-500">本机访问地址</div>
      <div id="pageUrl" class="text-emerald-400 font-mono text-xs sm:text-sm break-all cursor-point"></div>
    </div>
  </header>

  <section class="grid md:grid-cols-[auto_1fr] gap-4 sm:gap-6 items-start mb-5 sm:mb-8">
    <!-- 移动端：二维码卡片折叠为一行，点击展开 -->
    <div id="pageQrCard" class="bg-slate-900 border border-slate-700 rounded-2xl p-2 sm:p-3 flex flex-row sm:flex-col items-center gap-2 sm:gap-3 w-full sm:w-fit mx-auto md:mx-0 cursor-pointer hover:border-emerald-500/50 transition-colors group">
      <div class="text-xs text-slate-400 group-hover:text-emerald-400 transition-colors shrink-0 flex-1 sm:flex-none text-left sm:text-center">📱 手机扫码访问页面（点击放大）</div>
      <div id="pageQr" class="bg-white p-1 rounded-lg w-16 sm:w-32 flex items-center justify-center shrink-0"></div>
    </div>

    <div class="w-full">
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <button id="pickDirBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/70 hover:bg-slate-700 hover:border-emerald-500/40 transition text-xs sm:text-sm text-slate-300 shrink-0" title="上传整个文件夹，服务端会保留原有目录结构">
          📁 上传文件夹
        </button>
        <button id="watchDirBtn" class="px-2.5 sm:px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/70 hover:bg-slate-700 hover:border-emerald-500/40 transition text-xs sm:text-sm text-slate-300 shrink-0" title="选择一个本地目录，目录里新增的文件会自动上传">
          📡 监听目录
        </button>
        <span id="watchStatus" class="hidden text-[11px] sm:text-xs text-emerald-400 items-center gap-1.5"></span>
        <span class="text-[11px] sm:text-xs text-slate-500 hidden sm:inline">保留原有目录结构</span>
        <input id="dirInput" type="file" webkitdirectory directory multiple />
      </div>
      <!-- 移动端隐藏大上传区，改用右下角悬浮按钮，列表优先 -->
      <div id="dropZone" class="hidden sm:block border-2 border-dashed border-slate-600 hover:border-emerald-400 rounded-2xl p-6 sm:p-10 text-center transition cursor-pointer select-none">
        <div class="text-3xl sm:text-4xl mb-3">📤</div>
        <p class="font-medium text-sm sm:text-base text-slate-200">点击选择或拖拽文件到此处上传</p>
        <p class="text-[11px] sm:text-xs text-slate-500 mt-2">支持多文件同时上传 · 文件保存在本机 · 实时显示传输进度</p>
        <input id="fileInput" type="file" multiple />
      </div>
      <div id="uploadSummary" class="hidden mt-3 px-3 py-2 bg-slate-900/70 border border-slate-800 rounded-xl flex items-center gap-2 text-[11px] sm:text-xs flex-wrap"></div>
      <div id="uploadList" class="mt-3 space-y-2"></div>
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
      <h2 class="font-semibold text-base sm:text-lg">文件列表 <span id="fileCount" class="text-xs sm:text-sm text-slate-400 font-normal"></span></h2>
      <div class="flex gap-2 text-xs sm:text-sm items-center flex-wrap">
        <button id="inboxBtn" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 hover:bg-slate-700 transition" title="收件箱：只看最近收到的文件">
          <span class="sm:hidden">📥</span><span class="hidden sm:inline">📥 收件箱</span>
          <span id="inboxCount" class="hidden ml-1 text-emerald-400 font-mono"></span>
        </button>
        <button id="speedBtn" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 hover:bg-slate-700 transition" title="测速：测试当前局域网的传输速度">
          <span class="sm:hidden">🚀</span><span class="hidden sm:inline">🚀 测速</span>
        </button>
        <button id="trashBtn" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 hover:bg-slate-700 transition" title="回收站">
          <span class="sm:hidden">🗑</span><span class="hidden sm:inline">🗑 回收站</span>
          <span id="trashCount" class="hidden ml-1 text-amber-400 font-mono"></span>
        </button>
        <div class="relative">
          <input id="searchInput" type="search" placeholder="搜索文件名…" autocomplete="off"
            class="bg-slate-800 border border-slate-700 rounded-lg pl-7 pr-2.5 sm:pr-3 py-1.5 outline-none focus:border-emerald-500/60 placeholder:text-slate-500 w-32 sm:w-44" />
          <span class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none">🔍</span>
        </div>
        <select id="dirSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 outline-none cursor-pointer" title="按所在目录筛选">
          <option value="">全部目录</option>
        </select>
        <select id="extSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 outline-none cursor-pointer" title="按文件类型筛选">
          <option value="">全部类型</option>
        </select>
        <select id="sortSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 outline-none cursor-pointer">
          <option value="time">按时间排序</option>
          <option value="size">按大小排序</option>
        </select>
        <select id="pageSizeSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 sm:px-3 py-1.5 outline-none cursor-pointer" title="每页显示条数">
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
          <option value="100">100 条/页</option>
          <option value="200">200 条/页</option>
        </select>
        <button id="orderBtn" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 hover:bg-slate-700 transition">↓ 降序</button>
      </div>
    </div>
    <div id="batchBar" class="hidden mb-2 px-3 sm:px-4 py-2 bg-slate-900 border border-slate-800 rounded-2xl flex items-center gap-2 sm:gap-3 text-xs">
      <label class="flex items-center gap-1.5 cursor-pointer select-none text-slate-400 hover:text-slate-200 shrink-0">
        <input type="checkbox" id="selectAll" class="accent-emerald-500 w-3.5 h-3.5">
        <span class="hidden sm:inline">全选</span>
      </label>
      <span id="selectedCount" class="text-slate-500 hidden shrink-0"><em class="text-emerald-400 not-italic">0</em><span class="hidden sm:inline"> 项已选</span></span>
      <div class="flex-1 hidden sm:block"></div>
      <button id="batchShare" disabled class="px-2 py-1 rounded text-emerald-400 hover:bg-emerald-500/10 border border-emerald-500/30 disabled:opacity-30 disabled:cursor-not-allowed transition shrink-0" title="批量分享">
        <span class="sm:hidden">🔗</span><span class="hidden sm:inline">🔗 批量分享</span>
      </button>
      <button id="batchDownload" disabled class="px-2 py-1 rounded text-emerald-400 hover:bg-emerald-500/10 border border-emerald-500/30 disabled:opacity-30 disabled:cursor-not-allowed transition shrink-0" title="批量下载（打包为 zip）">
        <span class="sm:hidden">📥</span><span class="hidden sm:inline">📥 打包下载</span>
      </button>
      <button id="batchDelete" disabled class="px-2 py-1 rounded text-red-400 hover:bg-red-500/10 border border-red-500/30 disabled:opacity-30 disabled:cursor-not-allowed transition shrink-0" title="批量删除">
        <span class="sm:hidden">🗑</span><span class="hidden sm:inline">🗑 批量删除</span>
      </button>
    </div>
    <div id="fileList" class="bg-slate-900 border border-slate-800 rounded-2xl divide-y divide-slate-800"></div>
    <div id="emptyTip" class="hidden text-center text-slate-500 py-16">暂无文件，上传第一个文件开始传输吧</div>
    <div id="pager" class="hidden mt-3 flex items-center justify-center gap-1.5 sm:gap-2 text-xs sm:text-sm flex-wrap">
      <button id="firstPage" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition" title="第一页">« 首页</button>
      <button id="prevPage" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition">上一页</button>
      <span id="pageInfo" class="text-slate-400 font-mono px-1 whitespace-nowrap"></span>
      <button id="nextPage" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition">下一页</button>
      <button id="lastPage" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition" title="最后一页">末页 »</button>
      <span class="flex items-center gap-1">
        <input id="jumpInput" type="number" min="1" inputmode="numeric" placeholder="页码"
          class="w-14 sm:w-16 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 outline-none focus:border-emerald-500/60" />
        <button id="jumpBtn" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 transition">跳转</button>
      </span>
    </div>
  </section>
</div>

<!-- 移动端悬浮上传按钮 -->
<button id="fabUpload" class="sm:hidden fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-emerald-500 text-slate-950 text-2xl shadow-lg shadow-emerald-500/30 flex items-center justify-center active:scale-95 transition-transform" title="上传文件" aria-label="上传文件">📤</button>

<!-- 二维码弹窗 -->
<div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 flex flex-col items-center gap-4 max-w-sm w-full">
    <div class="text-sm text-slate-300">手机扫码</div>
    <div id="modalQr" class="bg-white p-2 rounded-lg"></div>
    <div id="modalText" class="text-xs text-slate-400 font-mono break-all max-w-xs text-center"></div>
    <button id="closeModal" class="text-sm bg-slate-700 hover:bg-slate-600 rounded-lg px-4 py-1.5 transition">关闭</button>
  </div>
</div>

<!-- 文件预览弹窗 -->
<div id="previewModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-2xl w-full max-h-[80vh] flex flex-col gap-3">
    <div class="flex items-center justify-between gap-3">
      <div id="previewTitle" class="text-sm font-medium truncate"></div>
      <div class="flex items-center gap-2 shrink-0">
        <a id="previewOpen" target="_blank" rel="noopener" class="text-[11px] text-slate-400 hover:text-emerald-400 px-2 py-1 rounded border border-slate-700 hover:border-emerald-500/40 transition">新窗口打开</a>
        <button id="closePreview" class="text-xs bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-1 transition">关闭</button>
      </div>
    </div>
    <div id="previewBody" class="hidden flex-1 min-h-0 overflow-auto"></div>
    <pre id="previewContent" class="hidden whitespace-pre-wrap break-all text-xs font-mono bg-slate-950 border border-slate-800 rounded-xl p-4 overflow-auto flex-1 text-slate-300"></pre>
  </div>
</div>

<!-- 回收站弹窗 -->
<div id="trashModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-2xl w-full max-h-[80vh] flex flex-col gap-3">
    <div class="flex items-center justify-between gap-3">
      <div class="text-sm font-medium">回收站 <span id="trashModalCount" class="text-xs text-slate-400 font-normal"></span></div>
      <div class="flex items-center gap-2">
        <button id="trashEmpty" class="text-[11px] text-slate-400 hover:text-red-400 px-2 py-1 rounded border border-slate-700 hover:border-red-500/40 transition">清空</button>
        <button id="closeTrash" class="text-xs bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-1 transition">关闭</button>
      </div>
    </div>
    <p class="text-[11px] text-slate-500">删除的文件会先放入回收站，保留期内可还原；过期后自动清理。</p>
    <div id="trashList" class="overflow-auto flex-1 divide-y divide-slate-800 border border-slate-800 rounded-xl"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] rounded-xl px-5 py-3 text-sm shadow-xl border border-white/10"></div>

<script src="/localsend/app.js"></script>
</body>
</html>
